<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-black: #111827;
            --brand-gray: #6B7280;
            --brand-gold: #F59E0B;
            --brand-gold-hover: #D97706;

            --bg-body: #FFFFFF;
            --bg-card: #FFFFFF;

            --text-main: #111827;
            --text-muted: #6B7280;
            --text-inverse: #FFFFFF;

            --border: #E5E7EB;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-main);
        }

        /* Navigation - Premium Black */
        .navbar {
            background: var(--brand-black);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-inverse);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.125rem;
        }

        .nav-brand-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-brand-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--brand-gold);
        }

        .nav-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        .nav-info svg {
            width: 18px;
            height: 18px;
            fill: var(--brand-gold);
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            color: var(--text-main);
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--brand-gold);
        }

        .product-image-container {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #f3f4f6;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--brand-black);
            color: var(--brand-gold);
            padding: 0.375rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-content {
            padding: 1.5rem;
        }

        .product-title {
            color: var(--text-main);
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .product-description {
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .product-price {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price-value {
            color: var(--brand-black);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .btn-view {
            padding: 0.625rem 1.25rem;
            background: transparent;
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-view:hover {
            background: var(--brand-gold);
            color: white;
        }

        .btn-view:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .empty-state-icon svg {
            width: 40px;
            height: 40px;
            fill: var(--primary);
        }

        .empty-state h2 {
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary);
            color: white;
            padding: 8px;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 1rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <a href="#products" class="skip-link">Skip to products</a>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <a href="/products" class="nav-brand">
            <div class="nav-brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z" />
                </svg>
            </div>
            Marketplace
        </a>
        <div class="nav-info">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                    clip-rule="evenodd" />
            </svg>
            Browse products from verified suppliers
        </div>
    </nav>

    <main class="main-content" role="main" id="products">
        <div class="page-header">
            <h1>Published Products</h1>
            <p>Discover quality products from trusted suppliers</p>
        </div>

        <div th:if="${products.empty}" class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z" />
                </svg>
            </div>
            <h2>No Products Available</h2>
            <p>Check back later for new products from our suppliers.</p>
        </div>

        <div th:unless="${products.empty}" class="products-grid">
            <article th:each="product : ${products}" class="product-card">
                <div class="product-image-container">
                    <img th:src="${!product.images.empty} ? ${product.images[0]} : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'"
                        th:alt="${product.title}" class="product-image" loading="lazy">
                    <span class="product-badge">Available</span>
                </div>
                <div class="product-content">
                    <h2 class="product-title" th:text="${product.title}">Product Title</h2>
                    <p class="product-description" th:text="${product.description}">Product description goes here...</p>
                    <div class="product-footer">
                        <div class="product-price">
                            <span class="price-label">Price</span>
                            <span class="price-value"
                                th:text="${product.price.amount} + ' ' + ${product.price.currency}">€ 99.99</span>
                        </div>
                        <button class="btn-view" aria-label="View product details">View Details</button>
                    </div>
                </div>
            </article>
        </div>
    </main>
</body>

</html>
