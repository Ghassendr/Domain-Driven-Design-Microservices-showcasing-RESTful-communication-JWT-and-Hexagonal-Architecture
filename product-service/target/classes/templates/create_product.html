<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product | Supplier Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-black: #111827;
            --brand-gray: #6B7280;
            --brand-gold: #F59E0B;
            --brand-gold-hover: #D97706;

            --bg-body: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-input: #F9FAFB;

            --text-main: #111827;
            --text-muted: #6B7280;
            --text-inverse: #FFFFFF;

            --border: #E5E7EB;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-main);
            padding-top: 80px;
            /* Space for fixed navbar */
        }

        /* Navigation - Premium Black */
        .navbar {
            background: var(--brand-black);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-inverse);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.125rem;
        }

        .nav-brand-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-brand-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--brand-gold);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border-radius: 8px;
            border: none;
            color: var(--text-inverse);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--brand-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .user-name {
            color: var(--text-inverse);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .btn-logout {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: var(--brand-gold);
            color: white;
            border-color: var(--brand-gold);
        }

        /* Main Content */
        .main-content {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            color: var(--text-main);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-muted);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.4s ease-out;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #059669;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-hint {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--brand-gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--brand-gold);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            background: var(--brand-gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
            background: var(--bg-input);
        }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary);
            color: white;
            padding: 8px;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }
    </style>
</head>

<body>
    <a href="#title" class="skip-link">Skip to main content</a>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <a href="/products/create" class="nav-brand">
            <div class="nav-brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z" />
                </svg>
            </div>
            Supplier Portal
        </a>
        <div class="nav-user">
            <div class="user-info">
                <div class="user-avatar" th:text="${supplierInitial != null ? supplierInitial : 'S'}">S</div>
                <span class="user-name"
                    th:text="${supplierEmail != null ? supplierEmail : 'Supplier'}">supplier@example.com</span>
            </div>
            <a href="/logout" class="btn-logout">Sign Out</a>
        </div>
    </nav>

    <main class="main-content" role="main">
        <div class="page-header">
            <h1>Create New Product</h1>
            <p>Add a new product to your catalog</p>
        </div>

        <div class="card">
            <div th:if="${param.success}" class="alert alert-success" role="alert" aria-live="polite">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                        clip-rule="evenodd" />
                </svg>
                Product saved successfully!
            </div>

            <form action="/products/create" method="post" novalidate>
                <div class="form-group">
                    <label for="title" class="form-label">Product Title</label>
                    <input type="text" id="title" name="title" class="form-input" placeholder="Enter product title"
                        required aria-required="true">
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" name="description" class="form-textarea"
                        placeholder="Describe your product..." aria-describedby="description-hint"></textarea>
                    <span class="form-hint" id="description-hint">Detailed description helps customers understand your
                        product</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price" class="form-label">Price (EUR)</label>
                        <input type="number" id="price" name="price" class="form-input" placeholder="0.00" step="0.01"
                            min="0" required aria-required="true">
                    </div>
                    <div class="form-group">
                        <label for="images" class="form-label">Image URLs</label>
                        <input type="text" id="images" name="images" class="form-input" placeholder="https://..."
                            aria-describedby="images-hint">
                        <span class="form-hint" id="images-hint">Comma-separated URLs</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" name="action" value="draft" class="btn btn-secondary">
                        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                        </svg>
                        Save as Draft
                    </button>
                    <button type="submit" name="action" value="publish" class="btn btn-primary">
                        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                clip-rule="evenodd" />
                        </svg>
                        Publish Now
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
