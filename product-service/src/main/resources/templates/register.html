<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Supplier Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-black: #111827;
            --brand-gray: #6B7280;
            --brand-gold: #F59E0B;
            --brand-gold-hover: #D97706;

            --bg-body: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-input: #F9FAFB;

            --text-main: #111827;
            --text-muted: #6B7280;

            --border: #E5E7EB;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 1rem;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.4s ease-out;
        }

        .logo h1 {
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: var(--brand-black);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon svg {
            fill: var(--brand-gold);
        }

        .form-label {
            display: block;
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand-gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: var(--brand-gold);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: var(--brand-gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 1rem;
        }

        .login-link {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .login-link a {
            color: var(--brand-black);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: var(--brand-gold);
        }

        .login-link a:focus {
            outline: 2px solid var(--brand-gold);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary);
            color: white;
            padding: 8px;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <a href="#companyName" class="skip-link">Skip to main content</a>

    <main class="register-container" role="main">
        <div class="logo">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
            </div>
            <h1>Create Account</h1>
            <p>Join as a supplier to list your products</p>
        </div>

        <div th:if="${error}" class="alert alert-error" role="alert" aria-live="polite">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                    clip-rule="evenodd" />
            </svg>
            <span th:text="${error}">Registration error</span>
        </div>

        <form action="/register" method="post" novalidate>
            <div class="form-group">
                <label for="companyName" class="form-label">Company Name</label>
                <input type="text" id="companyName" name="companyName" class="form-input"
                    placeholder="Your Company Ltd." required autocomplete="organization" aria-required="true">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="supplier@company.com"
                    required autocomplete="email" aria-required="true">
                <span class="form-hint" id="email-hint">This will be used for login</span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input"
                    placeholder="Create a strong password" required minlength="8" autocomplete="new-password"
                    aria-required="true" aria-describedby="password-hint">
                <span class="form-hint" id="password-hint">Minimum 8 characters</span>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="divider"><span>or</span></div>

        <p class="login-link">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </main>
</body>

</html>
